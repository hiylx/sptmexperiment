name: Build (unsigned)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SPTMRaceDetector.xcodeproj \
            -scheme SPTMRaceDetector \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP=build/Build/Products/Release-iphoneos/SPTMRaceDetector.app
          test -d "$APP"
          rm -rf Payload SPTMRaceDetector-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SPTMRaceDetector-unsigned.ipa Payload
          ls -l SPTMRaceDetector-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SPTMRaceDetector-unsigned
          path: SPTMRaceDetector-unsigned.ipa
          if-no-files-found: error
